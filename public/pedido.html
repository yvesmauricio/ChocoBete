<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF5EC">
<title>ChocoBete — Faça seu pedido</title>
<link rel="icon" href="/icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --vinho:#5A2F3B; --rose:#B58A94; --rose-claro:#F6E9EC; --creme:#FBF5EC; --cinza:#4A4A4A; --borda:#EADDE0; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--creme); color: var(--cinza); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 440px; margin: 0 auto; padding: max(40px, env(safe-area-inset-top)) 20px max(32px, env(safe-area-inset-bottom)); text-align: center; }
  h1 { font-family: 'Gelasio', Georgia, serif; font-weight: 700; font-size: 40px; line-height: 1.1; color: var(--vinho); }
  .fio { display: block; width: 120px; height: 10px; margin: 14px auto 10px; }
  .slogan { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--cinza); }
  .escolha { margin: 38px 0 14px; font-family: 'Gelasio', Georgia, serif; font-size: 18px; color: var(--vinho); }
  .opcoes { display: flex; flex-direction: column; gap: 12px; }
  .opcao { display: block; text-decoration: none; text-align: left; background: #fff; border: 1px solid var(--borda); border-radius: 16px; padding: 18px 20px; position: relative; transition: border-color .15s, background .15s; }
  .opcao:active { background: var(--rose-claro); border-color: var(--rose); }
  .opcao strong { display: block; font-family: 'Gelasio', Georgia, serif; font-weight: 700; font-size: 21px; color: var(--vinho); }
  .opcao span { display: block; margin-top: 4px; padding-right: 28px; font-size: 13.5px; line-height: 1.45; color: var(--cinza); }
  .opcao::after { content: "›"; position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 28px; line-height: 1; color: var(--rose); }
  .insta { display: inline-block; margin-top: 34px; padding: 7px 16px; border: 1px solid var(--rose); border-radius: 999px; color: var(--vinho); text-decoration: none; font-family: 'Gelasio', Georgia, serif; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>ChocoBete</h1>
  <svg class="fio" viewBox="0 0 120 10" aria-hidden="true"><path d="M0 5H46M74 5H120" stroke="#B58A94" stroke-width="1" fill="none"/><path d="M60 .5L64.5 5 60 9.5 55.5 5z" fill="#B58A94"/></svg>
  <p class="slogan">Chocolate nobre, feito à mão</p>

  <p class="escolha">O que você procura hoje?</p>
  <div class="opcoes">
    <a class="opcao" href="/pedido-diaadia">
      <strong>Dia a dia</strong>
      <span>Trufas, cones, barras, bolos e brownies para adoçar o seu dia.</span>
    </a>
    <a class="opcao" href="/pedido-festa">
      <strong>Festas e encomendas</strong>
      <span>Para comemorações e datas especiais, com encomenda antecipada.</span>
    </a>
  </div>

  <a class="insta" href="https://instagram.com/choco.bete">@choco.bete</a>
</main>
</body>
</html>
